name: release-binaries

# Build ethean client archives (ethean + ethean-prover) for Linux / macOS / Windows and attach them
# to an existing (or newly tagged) GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach assets to (e.g. v0.1.47)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  REPO_URL: https://github.com/ethean-labs/ethean

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Windows builds via vendor/leanvm-windows overlays (system-info + zk-alloc).
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            experimental: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            experimental: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            experimental: false
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            experimental: false
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            experimental: false

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "tag must start with v (got: $TAG)" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build ethean + ethean-prover (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          cargo build -p ethean -p ethean-prover --release --locked --target "${{ matrix.target }}"

      - name: Build ethean + ethean-prover (cross)
        if: matrix.cross
        shell: bash
        run: |
          cross build -p ethean -p ethean-prover --release --locked --target "${{ matrix.target }}"

      - name: Package archive
        shell: bash
        run: |
          chmod +x tools/release/package-ethean.sh
          tools/release/package-ethean.sh \
            "${{ steps.ver.outputs.version }}" \
            "${{ matrix.target }}" \
            "$GITHUB_WORKSPACE/dist"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: ethean-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish-assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Collect into dist/
        shell: bash
        run: |
          mkdir -p dist
          find dist-all -type f -print -exec cp -f {} dist/ \;
          ls -la dist
          chmod +x tools/release/render-binaries-notes.sh
          tools/release/render-binaries-notes.sh \
            "${{ steps.ver.outputs.version }}" dist > binaries-section.md
          cat binaries-section.md

      - name: Prepare release notes and title
        id: notes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          ver = "${{ steps.ver.outputs.version }}"
          pat = rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pat, changelog)
          notes = m.group(1).strip() if m else f"Ethean Lean Consensus Client {ver}"
          binaries = Path("binaries-section.md").read_text(encoding="utf-8").strip() if Path("binaries-section.md").exists() else ""
          if binaries:
              body = binaries + "\n\n---\n\n" + notes + "\n"
          else:
              body = notes + "\n"
          Path("release-notes.md").write_text(body, encoding="utf-8")

          m_summary = re.search(r"Milestone covering[^:]*:\s*([^.]+?)\.", notes, re.DOTALL)
          if m_summary:
              topic = " ".join(m_summary.group(1).split())
              if len(topic) > 80:
                  topic = topic[:77].rsplit(" ", 1)[0] + "..."
              title = f"{ver} - {topic}"
          else:
              title = f"{ver} - Ethean Lean Consensus Client"
          Path("release-title.txt").write_text(title, encoding="utf-8")
          PY
          echo "Title: $(cat release-title.txt)"

      - name: Create or publish release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          TITLE="$(cat release-title.txt)"

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Creating release $TAG with assets in single atomic step (Immutable Releases safe)..."
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --latest
          else
            echo "Release $TAG already exists, uploading assets and updating notes..."
            gh release upload "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --clobber || true
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes-file release-notes.md || true
          fi

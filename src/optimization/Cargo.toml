[package]
name = "ethean-optimization"
version = "0.1.0"
edition = "2021"
authors = ["Ethean contributors"]
description = "Advanced optimization system for Ethean Lean Consensus Client"
license = "MIT"

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

# Async and concurrency
futures = "0.3"
arc-swap = "1.6"
parking_lot = "0.12"

# Logging and monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Machine Learning
candle-core = "0.6"
candle-nn = "0.6"
candle-transformers = "0.6"
ndarray = "0.15"
smartcore = "0.3"

# Networking
reqwest = { version = "0.12", features = ["json"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# WebSocket support
tokio-tungstenite = "0.24"
tungstenite = "0.24"

# Time and data handling
chrono = { version = "0.4", features = ["serde"] }
humantime = "2.1"

# Storage and caching
rocksdb = "0.22"
redis = { version = "0.26", features = ["tokio-comp"] }
dashmap = "6.0"

# Performance monitoring
procfs = "0.16"
sysinfo = "0.30"

# Crypto and hashing
sha2 = "0.10"
blake3 = "1.5"

# Configuration
config = "0.14"
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
mockall = "0.13"

[features]
default = ["ml-optimization", "intelligent-cache", "monitoring"]

# Core optimization features
ml-optimization = []
intelligent-cache = []
monitoring = []

# Additional features
gpu-acceleration = []
distributed-optimization = []
advanced-analytics = []

# Development features
dev-tools = []
performance-profiling = []

[[bench]]
name = "optimization_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[package.metadata.docs.rs]
all-features = true

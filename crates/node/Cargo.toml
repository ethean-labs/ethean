[package]
name = "ethean-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Ethean Lean Consensus node library"

[lib]
name = "ethean_node"
path = "src/lib.rs"

[dependencies]
ethean-primitives = { workspace = true }
ethean-profile = { workspace = true }
ethean-ssz = { workspace = true }
ethean-types = { workspace = true }
ethean-genesis = { workspace = true }
ethean-transition = { workspace = true }
ethean-fork-choice = { workspace = true }
ethean-crypto = { workspace = true, features = ["test-hmac"] }
ethean-validator = { workspace = true }
ethean-network = { workspace = true }
ethean-storage = { workspace = true }
ethean-sync = { workspace = true }
ethean-rpc = { workspace = true }
ethean-metrics = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Forward optional libp2p QUIC swarm from ethean-network.
libp2p-quic = ["ethean-network/libp2p-quic"]

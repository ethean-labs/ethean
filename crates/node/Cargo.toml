[package]
name = "ethean-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Ethean Lean Consensus node library (legacy modules during workspace migration)"

[lib]
name = "ethean_node"
path = "src/lib.rs"

[dependencies]
ethean-primitives = { workspace = true }
ethean-profile = { workspace = true }
ethean-ssz = { workspace = true }
ethean-types = { workspace = true }
ethean-genesis = { workspace = true }
ethean-transition = { workspace = true }
ethean-fork-choice = { workspace = true }
ethean-crypto = { workspace = true, features = ["test-hmac"] }
ethean-validator = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
sha2 = { workspace = true }
rocksdb = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
libp2p = { workspace = true }
blst = { workspace = true }
rand = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
config = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
blstrs = { workspace = true }
bls12_381 = { workspace = true }

[features]
default = []
rocksdb = ["dep:rocksdb"]

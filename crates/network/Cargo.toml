[package]
name = "ethean-network"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lean Consensus P2P / QUIC networking (Phase 10)"

[dependencies]
ethean-primitives = { workspace = true }
ethean-network-wire = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
libp2p = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
default = []
# Real libp2p QUIC-v1 swarm (no TCP/WS listen path in our API).
libp2p-quic = [
    "dep:libp2p",
    "dep:tokio",
    "libp2p/quic",
    "libp2p/tokio",
    "libp2p/ping",
    "libp2p/macros",
    "libp2p/gossipsub",
]

[lib]
name = "ethean_network"
path = "src/lib.rs"

[package]
name = "ethean-network"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lean Consensus P2P / QUIC networking (Phase 10)"

[dependencies]
ethean-primitives = { workspace = true }
ethean-network-wire = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
rlp = "0.6"
base64 = "0.22"
bs58 = "0.5"
libp2p = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }

[features]
default = []
# Real libp2p QUIC-v1 swarm (no TCP/WS listen path in our API).
libp2p-quic = [
    "dep:libp2p",
    "dep:tokio",
    "dep:futures",
    "dep:async-trait",
    "libp2p/quic",
    "libp2p/tokio",
    "libp2p/ping",
    "libp2p/macros",
    "libp2p/gossipsub",
    "libp2p/identify",
    "libp2p/request-response",
    "libp2p/secp256k1",
]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
sha2 = { workspace = true }
ethean-network-wire = { workspace = true }
ethean-primitives = { workspace = true }
libp2p = { workspace = true, features = ["quic", "tokio", "ping", "macros", "gossipsub", "request-response", "secp256k1"] }

[lib]
name = "ethean_network"
path = "src/lib.rs"

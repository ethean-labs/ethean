[package]
name = "ethean-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Lean Consensus XMSS crypto surface for Ethean (PROD_CONFIG wire types)"

[dependencies]
ethean-primitives = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true, optional = true }
# Optional: pinned leanSig (Devnet 4). Default off — see tools/release/check-leansig-backend.ps1
# for the local num-bigint 0.5 [patch] required until upstream unifies with Plonky3.
leansig = { git = "https://github.com/leanEthereum/leanSig", rev = "c08a3bae74b0d85379cab72dcbefa4091546ecbb", package = "leansig", optional = true }
rand = { version = "0.10", optional = true }

[features]
# Default: fail-closed production + test helpers with real binding (never always-true).
default = ["test-hmac", "test-aggregate"]
# Compile/wrap leanSig PROD (needs local vendor [patch] until upstream num-bigint unifies).
leansig-backend = ["dep:leansig", "dep:rand"]
# leanVM prove/verify surface (fail-closed stub until LEANVM_FFI_LINKED; see backend_leanvm.rs).
leanvm-backend = []
test-hmac = []
test-aggregate = []
serde = ["dep:serde"]

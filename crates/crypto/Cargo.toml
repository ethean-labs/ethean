[package]
name = "ethean-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native leanSpec XMSS (KoalaBear / Poseidon1 / SHAKE128) and aggregation surface for Ethean"

[dependencies]
ethean-primitives = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true, optional = true }

[features]
# HMAC stand-in with PROD wire sizes for fast unit tests (never production).
default = ["test-hmac"]
test-hmac = []
serde = ["dep:serde"]

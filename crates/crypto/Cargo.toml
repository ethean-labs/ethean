[package]
name = "ethean-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native leanSpec XMSS (KoalaBear / Poseidon1 / SHAKE128) and aggregation surface for Ethean"

[dependencies]
ethean-primitives = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true, optional = true }

[features]
# Default: fail-closed production XMSS plus the HMAC test backend used by unit tests.
default = ["test-hmac"]
# Kept for downstream feature forwarding; the XMSS backend is always native now.
leansig-backend = []
# leanVM prove/verify surface (fail-closed stub until LEANVM_FFI_LINKED; see backend_leanvm.rs).
leanvm-backend = []
test-hmac = []
# Synthetic, statement-bound aggregate proofs for tests. Never enable in a
# production binary: it makes `verify_type2` accept keyless proofs.
test-aggregate = []
serde = ["dep:serde"]

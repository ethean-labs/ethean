[workspace]
members = [
    "crates/primitives",
    "crates/profile",
    "crates/ssz",
    "crates/types",
    "crates/crypto",
    "crates/multisig",
    "crates/genesis",
    "crates/transition",
    "crates/fork-choice",
    "crates/storage",
    "crates/network-wire",
    "crates/network",
    "crates/sync",
    "crates/validator",
    "crates/node",
    "crates/rpc",
    "crates/metrics",
    "crates/spec-fixtures",
    "bin/ethean",
    "bin/ethean-prover",
]
resolver = "2"

[workspace.package]
version = "0.1.54"
edition = "2021"
license = "MIT"
authors = ["Ethean contributors"]
repository = "https://github.com/ethean-labs/ethean"

[workspace.dependencies]
ethean-primitives = { path = "crates/primitives" }
ethean-profile = { path = "crates/profile" }
ethean-ssz = { path = "crates/ssz" }
ethean-types = { path = "crates/types" }
ethean-crypto = { path = "crates/crypto" }
ethean-multisig = { path = "crates/multisig" }
ethean-genesis = { path = "crates/genesis" }
ethean-transition = { path = "crates/transition" }
ethean-fork-choice = { path = "crates/fork-choice" }
ethean-storage = { path = "crates/storage" }
ethean-network-wire = { path = "crates/network-wire" }
ethean-network = { path = "crates/network" }
ethean-sync = { path = "crates/sync" }
ethean-validator = { path = "crates/validator" }
ethean-node = { path = "crates/node" }
ethean-rpc = { path = "crates/rpc" }
ethean-spec-fixtures = { path = "crates/spec-fixtures" }
ethean-metrics = { path = "crates/metrics" }

tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
rocksdb = "0.21"
redb = "2.6"
futures = "0.3"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
clap = { version = "4.0", features = ["derive"] }
tempfile = "3.8"
libp2p = { version = "0.54", default-features = false, features = ["quic", "tokio", "ping", "macros", "secp256k1"] }

[profile.release]
lto = true
codegen-units = 1
# Unwind so a panic inside leanMultisig on a hostile proof is contained by the
# verifier's thread boundary and rejected, instead of aborting the node.
panic = "unwind"

[profile.dev]
debug = true
opt-level = 0

# leanVM e2592df4's system-info / zk-alloc assume Unix mmap and getrusage.
# Overlay Windows-compatible stubs so release archives can include x86_64-pc-windows-msvc.
[patch."https://github.com/leanEthereum/leanVM.git"]
system-info = { path = "vendor/leanvm-windows/system-info" }
zk-alloc = { path = "vendor/leanvm-windows/zk-alloc" }

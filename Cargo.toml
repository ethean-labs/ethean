[package]
name = "panro"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/panro-labs/panro"
authors = ["Panro Team <paro@gmx.us>"]

[[bin]]
name = "panro"
path = "src/bin/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Web framework
axum = { version = "0.7", features = ["ws", "tracing"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
hyper = "1.0"
tokio-tungstenite = "0.21"
futures = "0.3"
futures-util = "0.3"

# API documentation and validation
utoipa = { version = "4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# Networking
libp2p = { version = "0.53", features = ["identify", "ping", "mdns", "yamux", "noise", "tcp", "dns", "gossipsub"] }

# Database
rocksdb = "0.22"

# Cryptography
blst = "0.3"
sha2 = "0.10"
rand = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Configuration
config = "0.14"
clap = { version = "4.0", features = ["derive"] }

# Testing
proptest = "1.0"
blstrs = "0.7.1"
bls12_381 = "0.8.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
opt-level = 0

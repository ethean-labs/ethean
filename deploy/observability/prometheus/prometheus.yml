global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Host-run ethean (Windows/Mac Docker Desktop / Linux host-gateway).
  - job_name: ethean
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          client: ethean
          network: pq-devnet-4
  # Same process when Prometheus runs on the host without Docker.
  - job_name: ethean-localhost
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          client: ethean
          network: pq-devnet-4

[package]
name = "ethean"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Ethean Lean Consensus Client binary"
default-run = "ethean"

[[bin]]
name = "ethean"
path = "src/main.rs"

[dependencies]
ethean-node = { workspace = true }
ethean-crypto = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
nu-ansi-term = "0.46"

[features]
# Default enables QUIC so `ethean start --bootnodes …` can dial pq-devnet peers.
default = ["libp2p-quic"]
libp2p-quic = ["ethean-node/libp2p-quic"]
# XMSS is native; kept so older run scripts that pass this feature still build.
leansig-backend = ["ethean-node/leansig-backend"]
# Synthetic aggregate proofs for offline smoke runs. Off by default so the
# shipped binary never accepts keyless Type-2 proofs.
test-aggregate = ["ethean-node/test-aggregate"]
# Optional leanVM surface (fail-closed until FFI linked).
leanvm-backend = ["ethean-node/leanvm-backend"]

